[tasks.start]
description = "Build and start the application with Docker Compose"
run = '''
docker compose up -d --build app
for attempt in $(seq 1 40); do
  if docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)" >/dev/null 2>&1; then
    echo "Sneaker Price Finder is ready at http://127.0.0.1:8000"
    exit 0
  fi
  sleep 1
done
docker compose logs app
echo "Application did not become healthy" >&2
exit 1
'''

[tasks.stop]
description = "Stop the application"
run = "docker compose down"

[tasks.logs]
description = "Follow application logs"
run = "docker compose logs -f app"

[tasks.test]
description = "Run backend and frontend checks in Docker"
run = "docker compose --profile test run --rm --build test"
