[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sneaker-price-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.52.1", "pydantic==2.13.4",
  "SQLAlchemy==2.0.52", "alembic==1.19.1", "httpx==0.28.1",
  "beautifulsoup4==4.15.0", "structlog==26.1.0", "playwright==1.62.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in tests which contact retailer websites"]

[tool.setuptools.packages.find]
include = ["app*"]
